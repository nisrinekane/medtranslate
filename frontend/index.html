<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTranslate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header span.dot {
      width: 8px;
      height: 8px;
      background: #4ecca3;
      border-radius: 50%;
      display: inline-block;
    }

    .columns {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .column:first-child {
      border-right: 1px solid #ddd;
    }

    .column-header {
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      color: #666;
    }

    .column:first-child .column-header { color: #2563eb; }
    .column:last-child .column-header { color: #d97706; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.5;
      max-width: 90%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.source {
      background: #e8f0fe;
      color: #1a1a2e;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message.translated {
      background: #fff;
      color: #333;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .message .text[contenteditable="true"] {
      outline: none;
      cursor: text;
      border-radius: 4px;
      padding: 2px 4px;
      margin: 0 -4px;
      transition: background 0.15s ease;
    }

    .message .text[contenteditable="true"]:hover {
      background: #f6f8fa;
    }

    .message .text[contenteditable="true"]:focus {
      background: #f0f4ff;
      box-shadow: inset 0 0 0 1px #2563eb;
    }

    .message .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .message .play-btn {
      background: #fff;
      border: 1px solid #d0d7de;
      color: #555;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .message .play-btn:hover {
      background: #f6f8fa;
      border-color: #2563eb;
      color: #2563eb;
    }

    .message .play-btn svg {
      width: 11px;
      height: 11px;
    }

    .message .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      color: #888;
    }

    .controls {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 16px;
    }

    .record-btn {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .record-btn:active { transform: scale(0.98); }

    .btn-en {
      background: #2563eb;
      color: #fff;
    }
    .btn-en:hover { background: #1d4ed8; }

    .btn-es {
      background: #d97706;
      color: #fff;
    }
    .btn-es:hover { background: #b45309; }

    .record-btn.recording {
      animation: pulse 1s infinite;
    }

    .record-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    }

    .record-btn.recording.btn-en { background: #dc2626; }
    .record-btn.recording.btn-es { background: #dc2626; }

    .status {
      text-align: center;
      padding: 8px;
      font-size: 13px;
      color: #888;
      background: #fff;
      border-top: 1px solid #f0f0f0;
    }

    .mic-icon {
      width: 20px;
      height: 20px;
    }

    .alert {
      background: #fef2f2;
      border-bottom: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 20px;
      display: none;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .alert.show { display: flex; }

    .alert-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    .alert-body { flex: 1; }

    .alert-title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .alert-detail {
      color: #7f1d1d;
      font-size: 13px;
    }

    .alert-close {
      background: none;
      border: none;
      color: #991b1b;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0.7;
    }

    .alert-close:hover { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <span class="dot"></span>
    MedTranslate
  </header>

  <div class="alert" id="alert" role="alert">
    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <div class="alert-body">
      <div class="alert-title" id="alert-title"></div>
      <div class="alert-detail" id="alert-detail"></div>
    </div>
    <button class="alert-close" type="button" onclick="hideAlert()" aria-label="Dismiss">&times;</button>
  </div>

  <div class="columns">
    <div class="column">
      <div class="column-header">English</div>
      <div class="messages" id="messages-en"></div>
    </div>
    <div class="column">
      <div class="column-header">Español</div>
      <div class="messages" id="messages-es"></div>
    </div>
  </div>

  <div class="status" id="status">Press a button and speak</div>

  <div class="controls">
    <button class="record-btn btn-en" id="btn-en" onclick="startRecording('en-es')">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      English
    </button>
    <button class="record-btn btn-es" id="btn-es" onclick="startRecording('es-en')">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      Español
    </button>
  </div>

  <script>
    // preload voices on page load
    speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentDirection = null;

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function showAlert(title, detail) {
      document.getElementById('alert-title').textContent = title;
      document.getElementById('alert-detail').textContent = detail;
      document.getElementById('alert').classList.add('show');
    }

    function hideAlert() {
      document.getElementById('alert').classList.remove('show');
    }

    function describeMicError(err) {
      const name = err && err.name;
      switch (name) {
        case 'NotAllowedError':
        case 'PermissionDeniedError':
          return {
            title: 'Microphone access blocked',
            detail: 'Your browser denied microphone access. Click the lock icon in the address bar and allow microphone, then try again.'
          };
        case 'NotFoundError':
        case 'DevicesNotFoundError':
          return {
            title: 'No microphone detected',
            detail: 'No microphone was found on this device. Connect a microphone and try again.'
          };
        case 'NotReadableError':
        case 'TrackStartError':
          return {
            title: 'Microphone is in use',
            detail: 'Another application is using the microphone, or the device returned a hardware error. Close other apps (Zoom, Teams, etc.) and try again.'
          };
        case 'OverconstrainedError':
        case 'ConstraintNotSatisfiedError':
          return {
            title: 'Microphone not compatible',
            detail: 'The microphone does not meet the required audio settings. Try a different microphone.'
          };
        case 'SecurityError':
          return {
            title: 'Microphone blocked by browser',
            detail: 'Microphone access requires a secure connection (HTTPS) or localhost. Reload the page over HTTPS.'
          };
        case 'AbortError':
          return {
            title: 'Recording interrupted',
            detail: 'The recording was cancelled before it could start. Please try again.'
          };
        default:
          return {
            title: 'Could not start recording',
            detail: (err && err.message) ? err.message : 'An unknown error occurred while accessing the microphone.'
          };
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function buildMessage(el, labelText, text, variant, ttsLang) {
      el.className = `message ${variant}`;
      const isTranslated = variant === 'translated';
      el.innerHTML = `
        <div class="label">${labelText}</div>
        <div class="text"${isTranslated ? ' contenteditable="true" spellcheck="true"' : ''}>${escapeHtml(text)}</div>
        ${isTranslated ? `
          <div class="actions">
            <button class="play-btn" type="button" title="Play edited text">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              Play
            </button>
          </div>
        ` : ''}
      `;
      if (isTranslated) {
        const btn = el.querySelector('.play-btn');
        const textEl = el.querySelector('.text');
        btn.addEventListener('click', () => speak(textEl.textContent.trim(), ttsLang));
        textEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            textEl.blur();
            speak(textEl.textContent.trim(), ttsLang);
          }
        });
      }
    }

    function addMessage(enText, esText, direction) {
      const enCol = document.getElementById('messages-en');
      const esCol = document.getElementById('messages-es');

      const enMsg = document.createElement('div');
      const esMsg = document.createElement('div');

      if (direction === 'en-es') {
        buildMessage(enMsg, 'Doctor', enText, 'source');
        buildMessage(esMsg, 'Doctor (traducido)', esText, 'translated', 'es');
      } else {
        buildMessage(esMsg, 'Paciente', esText, 'source');
        buildMessage(enMsg, 'Patient (translated)', enText, 'translated', 'en');
      }

      enCol.appendChild(enMsg);
      esCol.appendChild(esMsg);

      enCol.scrollTop = enCol.scrollHeight;
      esCol.scrollTop = esCol.scrollHeight;
    }

    function speak(text, lang) {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'es' ? 'es-ES' : 'en-US';
      utterance.rate = 0.9;

      // chrome needs voices to be loaded first
      const voices = speechSynthesis.getVoices();
      const voice = voices.find(v => v.lang.startsWith(lang === 'es' ? 'es' : 'en'));
      if (voice) utterance.voice = voice;

      speechSynthesis.speak(utterance);
    }

    async function startRecording(direction) {
      if (isRecording) {
        stopRecording();
        return;
      }

      currentDirection = direction;
      hideAlert();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showAlert(
          'Microphone not supported',
          'This browser does not support microphone recording. Please use a recent version of Chrome, Edge, Firefox, or Safari over HTTPS or localhost.'
        );
        setStatus('Microphone unavailable');
        return;
      }

      if (typeof MediaRecorder === 'undefined') {
        showAlert(
          'Recording not supported',
          'This browser does not support audio recording. Please use a recent version of Chrome, Edge, Firefox, or Safari.'
        );
        setStatus('Recording unavailable');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());

          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await sendAudio(audioBlob, currentDirection);
        };

        mediaRecorder.start();
        isRecording = true;

        const btnId = direction === 'en-es' ? 'btn-en' : 'btn-es';
        const otherBtnId = direction === 'en-es' ? 'btn-es' : 'btn-en';
        document.getElementById(btnId).classList.add('recording');
        document.getElementById(btnId).innerHTML = `
          <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
          Stop`;
        document.getElementById(otherBtnId).disabled = true;

        setStatus('Listening...');
      } catch (err) {
        const { title, detail } = describeMicError(err);
        showAlert(title, detail);
        setStatus('Press a button and speak');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        isRecording = false;

        document.getElementById('btn-en').classList.remove('recording');
        document.getElementById('btn-en').disabled = false;
        document.getElementById('btn-en').innerHTML = `
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          English`;

        document.getElementById('btn-es').classList.remove('recording');
        document.getElementById('btn-es').disabled = false;
        document.getElementById('btn-es').innerHTML = `
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          Español`;

        setStatus('Processing...');
      }
    }

    async function sendAudio(blob, direction) {
      try {
        const formData = new FormData();
        formData.append('audio', blob, 'recording.webm');
        formData.append('direction', direction);

        const response = await fetch('/transcribe', { method: 'POST', body: formData });
        const data = await response.json();

        const enText = direction === 'en-es' ? data.source_text : data.translated_text;
        const esText = direction === 'en-es' ? data.translated_text : data.source_text;

        addMessage(enText, esText, direction);

        // TTS reads the translated text in the target language
        const ttsLang = direction === 'en-es' ? 'es' : 'en';
        speak(data.translated_text, ttsLang);

        setStatus('Press a button and speak');
      } catch (err) {
        setStatus('Error: could not process audio');
      }
    }
  </script>

</body>
</html>
